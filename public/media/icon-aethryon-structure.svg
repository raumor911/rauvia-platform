<svg xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 256 256"
  role="img"
  aria-labelledby="title desc">
  <title id="title">Ícono de estructura AETHRYON</title>
  <desc id="desc">Estructura geométrica con seis nodos periféricos, conexiones y un hexágono central.</desc>

  <defs>
    <linearGradient id="coreGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#0B3A53"/>
    </linearGradient>
    <radialGradient id="nodeGradient" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#2A7F9E"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0F172A" flood-opacity=".18"/>
    </filter>
  </defs>

  <!-- Estructura exterior -->
  <g fill="none" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M128 28 L70 62 L70 128 L128 162 L186 128 L186 62 Z"/>
    <path d="M70 62 L128 96 L186 62"/>
    <path d="M70 128 L128 96 L186 128"/>
    <path d="M128 28 L128 96 L128 162"/>
    <path d="M70 62 L186 128"/>
    <path d="M186 62 L70 128"/>
    <path d="M70 128 L70 194 L128 228 L186 194 L186 128"/>
    <path d="M70 194 L128 162 L186 194"/>
    <path d="M128 162 L128 228"/>
  </g>

  <!-- Líneas internas tenues -->
  <g fill="none" stroke="#E2E8F0" stroke-width="2" stroke-dasharray="4 6">
    <circle cx="128" cy="128" r="72"/>
    <circle cx="128" cy="128" r="42"/>
  </g>

  <!-- Nodo central -->
  <polygon
    points="128,82 150,95 150,121 128,134 106,121 106,95"
    fill="url(#coreGradient)"
    stroke="#0B3A53"
    stroke-width="3"
    filter="url(#softShadow)"/>

  <!-- Nodos -->
  <g fill="url(#nodeGradient)" stroke="#0B3A53" stroke-width="2" filter="url(#softShadow)">
    <circle cx="128" cy="28" r="9"/>
    <circle cx="70" cy="62" r="9"/>
    <circle cx="186" cy="62" r="9"/>
    <circle cx="70" cy="128" r="9"/>
    <circle cx="186" cy="128" r="9"/>
    <circle cx="70" cy="194" r="9"/>
    <circle cx="186" cy="194" r="9"/>
    <circle cx="128" cy="228" r="9"/>
  </g>

  <!-- Puntos técnicos -->
  <g fill="#CBD5E1">
    <circle cx="42" cy="128" r="3"/>
    <circle cx="214" cy="128" r="3"/>
    <circle cx="128" cy="8" r="3"/>
    <circle cx="128" cy="248" r="3"/>
  </g>
</svg>