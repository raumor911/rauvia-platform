<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" role="img" aria-labelledby="title desc">
  <title id="title">Mapa de Crecimiento Estructural - RAUVIA & AETHRYON</title>
  <desc id="desc">Mapa interactivo de crecimiento estructural en secuencia de 5 etapas.</desc>

  <defs>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#0B3A53" flood-opacity=".18"/>
    </filter>
    <filter id="goldGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#F4B942" flood-opacity=".5"/>
    </filter>

    <style>
      .font { font-family: Inter, system-ui, sans-serif; }
      .stage-card { cursor: pointer; transition: transform 0.3s ease; }
      .stage-card:hover { transform: translateY(-6px); }
      .stage-bg { fill: #FFFFFF; stroke: #E2E8F0; stroke-width: 2; transition: all 0.3s ease; }
      .stage-card:hover .stage-bg { stroke: #2563EB; fill: #F8FAFC; filter: url(#softGlow); }
      .connector { fill: none; stroke: #94A3B8; stroke-width: 2.5; stroke-dasharray: 6 6; }
      .hex-node { fill: #0B3A53; stroke: #F4B942; stroke-width: 2; }
    </style>
  </defs>

  <!-- Background Grid & Wave -->
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <path d="M 100 250 Q 400 150 800 250 T 1500 250" fill="none" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Connecting Line -->
  <line x1="200" y1="230" x2="1400" y2="230" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="8 8"/>

  <!-- Stage 1 -->
  <g class="stage-card" transform="translate(100, 140)">
    <rect width="220" height="180" rx="16" class="stage-bg"/>
    <circle cx="110" cy="50" r="26" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1.5"/>
    <polygon points="110,34 123,42 123,58 110,66 97,58 97,42" fill="#0B3A53" stroke="#F4B942" stroke-width="1.5"/>
    <text x="110" y="105" text-anchor="middle" font-size="12" font-weight="700" fill="#64748B" class="font">ETAPA 01</text>
    <text x="110" y="125" text-anchor="middle" font-size="16" font-weight="800" fill="#0F172A" class="font">Frente Comercial</text>
    <text x="110" y="145" text-anchor="middle" font-size="12" fill="#475569" class="font">Captación y Diagnóstico</text>
  </g>

  <!-- Stage 2 -->
  <g class="stage-card" transform="translate(400, 140)">
    <rect width="220" height="180" rx="16" class="stage-bg"/>
    <circle cx="110" cy="50" r="26" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1.5"/>
    <polygon points="110,34 123,42 123,58 110,66 97,58 97,42" fill="#0B3A53" stroke="#F4B942" stroke-width="1.5"/>
    <text x="110" y="105" text-anchor="middle" font-size="12" font-weight="700" fill="#64748B" class="font">ETAPA 02</text>
    <text x="110" y="125" text-anchor="middle" font-size="16" font-weight="800" fill="#0F172A" class="font">Ruta 90</text>
    <text x="110" y="145" text-anchor="middle" font-size="12" fill="#475569" class="font">Plan de Ejecución Ágil</text>
  </g>

  <!-- Stage 3 (AETHRYON Core Highlighted) -->
  <g class="stage-card" transform="translate(700, 125)">
    <rect width="220" height="210" rx="16" fill="#0B3A53" stroke="#F4B942" stroke-width="2.5" filter="url(#softGlow)"/>
    <circle cx="110" cy="55" r="32" fill="#1E293B" stroke="#F4B942" stroke-width="2" filter="url(#goldGlow)"/>
    <polygon points="110,37 127,47 127,67 110,77 93,67 93,47" fill="#0B3A53" stroke="#F4B942" stroke-width="2"/>
    <text x="110" y="115" text-anchor="middle" font-size="12" font-weight="800" fill="#F4B942" class="font">ETAPA 03 • NÚCLEO</text>
    <text x="110" y="140" text-anchor="middle" font-size="18" font-weight="800" fill="#FFFFFF" class="font">AETHRYON</text>
    <text x="110" y="162" text-anchor="middle" font-size="12" fill="#94A3B8" class="font">Arquitectura Directiva</text>
    <text x="110" y="182" text-anchor="middle" font-size="11" font-weight="600" fill="#38BDF8" class="font">Ver interactivo →</text>
  </g>

  <!-- Stage 4 -->
  <g class="stage-card" transform="translate(1000, 140)">
    <rect width="220" height="180" rx="16" class="stage-bg"/>
    <circle cx="110" cy="50" r="26" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1.5"/>
    <polygon points="110,34 123,42 123,58 110,66 97,58 97,42" fill="#0B3A53" stroke="#F4B942" stroke-width="1.5"/>
    <text x="110" y="105" text-anchor="middle" font-size="12" font-weight="700" fill="#64748B" class="font">ETAPA 04</text>
    <text x="110" y="125" text-anchor="middle" font-size="16" font-weight="800" fill="#0F172A" class="font">Sistema Comercial</text>
    <text x="110" y="145" text-anchor="middle" font-size="12" fill="#475569" class="font">Automatización y Escala</text>
  </g>

  <!-- Stage 5 -->
  <g class="stage-card" transform="translate(1280, 140)">
    <rect width="220" height="180" rx="16" class="stage-bg"/>
    <circle cx="110" cy="50" r="26" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1.5"/>
    <polygon points="110,34 123,42 123,58 110,66 97,58 97,42" fill="#0B3A53" stroke="#F4B942" stroke-width="1.5"/>
    <text x="110" y="105" text-anchor="middle" font-size="12" font-weight="700" fill="#64748B" class="font">ETAPA 05</text>
    <text x="110" y="125" text-anchor="middle" font-size="16" font-weight="800" fill="#0F172A" class="font">Growth Partner</text>
    <text x="110" y="145" text-anchor="middle" font-size="12" fill="#475569" class="font">Consolidación y Dirección</text>
  </g>

</svg>
